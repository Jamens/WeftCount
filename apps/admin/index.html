<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>纬数 WeftCount · 纺织行业 AI 进销存</title>
    <script>
      // 防止暗色主题刷新时白屏闪烁：在首屏渲染前同步 body 背景
      try {
        if (localStorage.getItem('weft-theme') === 'dark') {
          document.documentElement.style.colorScheme = 'dark'
          document.body.style.background = '#000'
          document.body.style.color = 'rgba(255,255,255,0.88)'
        }
      } catch (e) {}
    </script>
    <style>
      /* 应用外壳固定视口高度：最外层(html/body)不滚动，
         列表页的滚动交给表格体内(scroll.y)，避免整页被撑出滚动条。
         #root 由 React 填充，antd Layout 用 height:100vh 撑满。 */
      html, body, #root { height: 100%; margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
